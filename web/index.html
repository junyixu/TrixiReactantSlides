<html lang="en">
<head>
<meta charset="utf-8">

<title>Trixi.jl on TPUs — slides</title>
<style>
  :root { --bg: #fafafa; --fg: #1b1b1b; --muted: #666; --accent: #c4600c; --line: #ddd; }

    :root { --bg: #161616; --fg: #e8e8e8; --muted: #9a9a9a; --accent: #eb811b; --line: #333; }

  body { margin: 0 auto; max-width: 46rem; padding: 2rem 16px; background: var(--bg); color: var(--fg);
         font: 16px/1.5 system-ui, sans-serif; }
  h1 { font-size: 1.5rem; margin-bottom: .25rem; }
  p { color: var(--muted); margin-top: 0; }
  ul { list-style: none; padding: 0; }
  li { display: flex; flex-wrap: wrap; align-items: baseline; gap: .25rem 1rem; padding: .8rem 0;
