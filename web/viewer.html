<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Slides</title>
<style>
  :root { color-scheme: dark; --accent: #eb811b; --bar: rgba(18, 18, 18, .88); --fg: #eee; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #000; color: var(--fg);
               font: 14px/1.4 system-ui, sans-serif; }
  #stage { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
  #slide { width: 100vw; height: 100vh; object-fit: contain; user-select: none; -webkit-user-drag: none; }
  #progress { position: fixed; left: 0; top: 0; height: 3px; width: 0; background: var(--accent);
              transition: width .2s; }
  #bar { position: fixed; left: 0; right: 0; bottom: 0; display: flex; align-items: center; gap: .5rem;
         padding: .4rem 16px; background: var(--bar); transition: opacity .3s; }
  #bar.hidden { opacity: 0; pointer-events: none; }
  #bar button, #bar a { background: none; color: var(--fg); border: 1px solid #555; border-radius: 4px;
                        padding: .2rem .6rem; font: inherit; cursor: pointer; text-decoration: none; }
  #bar button:hover, #bar a:hover { border-color: var(--accent); }
  #title { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; opacity: .75; }
  #count { font-variant-numeric: tabular-nums; }
  #grid { position: fixed; inset: 0; display: none; overflow-y: auto; padding: 16px; gap: 12px;
          grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); background: rgba(0, 0, 0, .94); }
  #grid.open { display: grid; }
  #grid figure { margin: 0; cursor: pointer; }
  #grid img { display: block; width: 100%; aspect-ratio: 16 / 9; object-fit: contain; background: #fafafa;
              border: 3px solid transparent; box-sizing: border-box; }
  #grid figure.current img { border-color: var(--accent); }
  #grid figcaption { text-align: center; opacity: .7; }
  @media (max-width: 600px) { #title { display: none; } }
</style>
</head>
<body>
<div id="progress"></div>
<div id="stage"><img id="slide" alt=""></div>
<div id="grid" aria-label="All slides"></div>
<div id="bar">
  <button id="prev" aria-label="Previous slide">←</button>
  <span id="count">– / –</span>
  <button id="next" aria-label="Next slide">→</button>
  <span id="title"></span>
  <button id="overview" title="Overview (o)">Overview</button>
  <button id="fullscreen" title="Full screen (f)">Full screen</button>
  <a id="pdf" href="slides.pdf" download>PDF</a>
  <a href="../" title="All decks">⌂</a>
</div>
<script>
const $ = id => document.getElementById(id);
const src = i => `slides/${i}.svg`;
let current = 1, total = 1, hideTimer;

function show(i) {
  current = Math.min(Math.max(i, 1), total);
  $("slide").src = src(current);
  $("slide").alt = `Slide ${current}`;
  $("count").textContent = `${current} / ${total}`;
  $("progress").style.width = `${100 * current / total}%`;
  if (location.hash !== `#${current}`) history.replaceState(null, "", `#${current}`);
  for (const k of [current + 1, current - 1]) if (k >= 1 && k <= total) new Image().src = src(k);
  document.querySelectorAll("#grid figure").forEach((f, k) => f.classList.toggle("current", k + 1 === current));
}
const next = () => show(current + 1), prev = () => show(current - 1);

function toggleGrid(open = !$("grid").classList.contains("open")) {
  $("grid").classList.toggle("open", open);
  if (open) document.querySelector("#grid figure.current")?.scrollIntoView({ block: "center" });
}
function toggleFullscreen() {
  if (document.fullscreenElement) document.exitFullscreen();
  else document.documentElement.requestFullscreen?.();
}
function wakeBar() {
  $("bar").classList.remove("hidden");
  clearTimeout(hideTimer);
  hideTimer = setTimeout(() => $("bar").classList.add("hidden"), 2500);
}

fetch("pages.json").then(r => r.json()).then(meta => {
  total = meta.pages;
  document.title = meta.title;
  $("title").textContent = meta.title;
  $("pdf").href = meta.pdf;
  for (let k = 1; k <= total; k++) {
    const f = document.createElement("figure");
    f.innerHTML = `<img loading="lazy" src="${src(k)}" alt="Slide ${k}"><figcaption>${k}</figcaption>`;
    f.onclick = () => { show(k); toggleGrid(false); };
    $("grid").append(f);
  }
  show(parseInt(location.hash.slice(1)) || 1);
  wakeBar();
});

document.addEventListener("keydown", e => {
  if (e.altKey || e.ctrlKey || e.metaKey) return;
  const k = e.key;
  if (["ArrowRight", "ArrowDown", "PageDown", "n"].includes(k) || (k === " " && !e.shiftKey)) next();
  else if (["ArrowLeft", "ArrowUp", "PageUp", "p", "Backspace"].includes(k) || (k === " " && e.shiftKey)) prev();
  else if (k === "Home") show(1);
  else if (k === "End") show(total);
  else if (k === "f") toggleFullscreen();
  else if (k === "o") toggleGrid();
  else if (k === "Escape") toggleGrid(false);
  else return;
  e.preventDefault();
});
$("stage").addEventListener("click", e => (e.clientX > innerWidth / 3 ? next() : prev()));
$("prev").onclick = prev;
$("next").onclick = next;
$("overview").onclick = () => toggleGrid();
$("fullscreen").onclick = toggleFullscreen;
addEventListener("hashchange", () => show(parseInt(location.hash.slice(1)) || 1));
addEventListener("mousemove", wakeBar);

let touchX = null;
addEventListener("touchstart", e => { touchX = e.touches[0].clientX; wakeBar(); }, { passive: true });
addEventListener("touchend", e => {
  if (touchX === null || $("grid").classList.contains("open")) return;
  const dx = e.changedTouches[0].clientX - touchX;
  if (Math.abs(dx) > 40) (dx < 0 ? next : prev)();
  touchX = null;
});
</script>
</body>
</html>
